name: readpos-release
# 1회용: index.html에 'Google Docs 이어 읽기' 패치를 적용하고 beta.html을 정리한다.
# 결과 md5가 로컬 검증값과 다르면 커밋하지 않는다. 적용 후 이 워크플로 파일은 삭제한다.
on:
  push:
    paths:
      - "tools/readpos_patch.py"
      - ".github/workflows/readpos-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch (md5-verified)
        run: python3 tools/readpos_patch.py index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch beta.html
          git add index.html
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -F - <<'MSG'
          index.html: Google Docs 이어 읽기 기능 반영 (beta.html 패치 7곳을 직접 적용), beta.html 삭제

          - Docs 문서 링크 북마크 → open.html?id= 로 열기, 메모 줄 📖 표시, 설정 메뉴 "Google Docs 이어 읽기 설정"
          - 결과 md5 1f913738684a749c2d096d47d3fa7b7e (로컬 검증본과 동일, tools/readpos_patch.py가 확인)

          Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01PTWo5FicPXDKQciHm6sohx
          MSG
          git push
