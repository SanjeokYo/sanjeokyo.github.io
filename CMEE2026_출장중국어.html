<!doctype html>
<html lang="ko" data-theme="light" data-size="m" class="tones">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>출장 중국어</title>
<style>
:root{
  --paper:#ffffff; --page:#f2f4f3; --ink:#1a1f1d; --ink-2:#4b5450; --ink-3:#77817c;
  --rule:#e1e5e3; --grid:#bfccc6; --grid-strong:#8fa39a; --amber:#c48600; --focus:#2463d1;
  --t1:#d0283a; --t2:#d97000; --t3:#1f8a4c; --t4:#2462cf; --t5:#868e8a;
  --scrim:rgba(10,14,12,.38);
  --fz:16px;
  --zh-sans:"Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --zh-serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun","Noto Sans SC","Noto Sans CJK SC",serif;
  --ko:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --hanja:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang","Noto Sans KR","Noto Sans CJK KR",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#000000; --page:#17191a; --ink:#ececea; --ink-2:#b9c1bd; --ink-3:#8c9590;
  --rule:#2a2f2d; --grid:#3d4a45; --grid-strong:#5f716a; --amber:#f0b429; --focus:#7aa7ff;
  --t1:#ff6b78; --t2:#ffa64d; --t3:#4fc985; --t4:#77a6ff; --t5:#9aa29e; --scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#000000; --page:#17191a; --ink:#ececea; --ink-2:#b9c1bd; --ink-3:#8c9590;
  --rule:#2a2f2d; --grid:#3d4a45; --grid-strong:#5f716a; --amber:#f0b429; --focus:#7aa7ff;
  --t1:#ff6b78; --t2:#ffa64d; --t3:#4fc985; --t4:#77a6ff; --t5:#9aa29e; --scrim:rgba(0,0,0,.6);
}
:root[data-size="s"]{--fz:15px} :root[data-size="l"]{--fz:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fz)/1.5 var(--ko);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* 田字格 — 글자를 공부하는 자리에는 언제나 연습 칸 */
.tz{position:relative;display:inline-grid;place-items:center;border:1.5px solid var(--grid-strong);background:var(--paper);flex:none}
.tz::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--grid)}
.tz::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--grid)}
.tz>*{position:relative;z-index:1}

/* 성조 색: 색은 오직 성조만 뜻한다 */
.tones .t1{color:var(--t1)} .tones .t2{color:var(--t2)} .tones .t3{color:var(--t3)} .tones .t4{color:var(--t4)} .tones .t5{color:var(--t5)}
.nopy .r-py,.nopy .py-full{display:none} .nopy .c-py{visibility:hidden}

.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--rule)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;font-family:var(--zh-serif);font-size:24px;line-height:1;color:var(--t1)}
.brand b{display:block;font-size:1.0625rem;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;color:var(--ink-3);font-size:.75rem}
.icon-btn{min-height:40px;padding:0 12px;border-radius:10px;color:var(--ink-2);font-size:.875rem}
.search{position:relative;margin-top:10px}
.search input{width:100%;height:46px;border:1.5px solid var(--rule);border-radius:12px;background:var(--page);padding:0 44px 0 14px;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.q-clear{position:absolute;right:4px;top:3px;width:40px;height:40px;color:var(--ink-3);font-size:1rem}

.filters{padding:10px 0 2px;transition:opacity .15s}
.filters.off{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:5px 13px;border-radius:999px;border:1px solid var(--rule);font-size:.875rem;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.seg{display:flex;margin:0 16px 4px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:38px;padding:4px;font-size:.8125rem;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);font-weight:700}
.count{margin:8px 16px 0;color:var(--ink-3);font-size:.8125rem}

.list{list-style:none;margin:0;padding:0}
.grp{padding:20px 16px 6px;font-size:.8125rem;font-weight:700;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.row{position:relative;display:flex;align-items:flex-start;gap:6px;padding:12px 6px 12px 16px;border-bottom:1px solid var(--rule)}
.row.p3::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;background:var(--amber)}
.row-main{flex:1;min-width:0;cursor:pointer}
.r-zh{font-family:var(--zh-sans);font-size:calc(var(--fz)*1.5);line-height:1.3;word-break:break-all}
.r-py{font-size:calc(var(--fz)*.875);margin-top:1px}
.r-ko{font-weight:700;margin-top:4px;line-height:1.35}
.r-sub{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:calc(var(--fz)*.8125);color:var(--ink-2)}
.r-hj{font-family:var(--hanja)}
.fav{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:1.375rem;color:var(--ink-3)}
.fav.on{color:var(--amber)}
.empty{padding:32px 20px;color:var(--ink-2);text-align:center;line-height:1.6}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:720px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;font-size:.75rem;color:var(--ink-3);min-height:60px}
.tabbar .ti{width:28px;height:28px;font-family:var(--zh-serif);font-size:17px;line-height:1;color:var(--ink-3)}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] .ti{color:var(--ink);border-color:var(--ink)}

.vh{margin:22px 16px 10px;font-size:1.0625rem;font-weight:700}
.vp{margin:-4px 16px 12px;color:var(--ink-2);font-size:.875rem}

/* 상세 시트 */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:100%;max-width:720px;max-height:94vh;max-height:94dvh;background:var(--paper);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:4px;padding:6px 4px 6px 6px;border-bottom:1px solid var(--rule)}
.sheet-title{flex:1;text-align:center;font-size:.875rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-plain{min-height:44px;min-width:56px;padding:0 10px;color:var(--ink-2);font-size:.9375rem}
.sheet-body{overflow-y:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.tzg{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 12px;margin:2px 0 18px}
.w{display:flex}
.w .cell+.cell .c-box{border-left-width:0}
.cell{--cell:clamp(52px,15vw,66px);display:flex;flex-direction:column;align-items:center;gap:4px}
.tzg.dense .cell{--cell:clamp(42px,11.5vw,54px)}
.c-py{font-size:.8125rem;font-weight:700;min-height:1.25em;white-space:nowrap}
.c-box{width:var(--cell);height:var(--cell)}
.c-ch{font-family:var(--zh-serif);font-size:calc(var(--cell)*.68);line-height:1}
.c-kr{font-family:var(--hanja);font-size:.75rem;color:var(--ink-2);min-height:1.25em;white-space:nowrap}
.cx{align-self:center;font-family:var(--zh-sans);font-size:1.375rem;color:var(--ink-2);padding-bottom:22px}
.meaning{font-size:calc(var(--fz)*1.3);font-weight:700;line-height:1.35;margin-bottom:14px}
.actions{display:flex;gap:8px;margin-bottom:20px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border:1.5px solid var(--ink);border-radius:12px;font-weight:700;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--rule);color:var(--ink-2);font-weight:600}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:7px 16px;margin:0 0 6px}
.facts dt{color:var(--ink-3);font-size:.8125rem;padding-top:.15em}
.facts dd{margin:0;line-height:1.45}
.hj{font-family:var(--hanja);font-size:1.25rem}
.sec{border-top:1px solid var(--rule);padding:16px 0 4px;margin-top:14px}
.sec h3{font-size:.8125rem;font-weight:700;color:var(--ink-3);margin-bottom:8px}
.sec p{line-height:1.6}
.glyphs{list-style:none;margin:0;padding:0}
.glyphs button{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px dashed var(--rule)}
.g-box{width:44px;height:44px;font-family:var(--zh-serif);font-size:28px;line-height:1}
.g-tr{font-family:var(--hanja);font-size:1.25rem;margin-right:6px}
.g-py{font-weight:700;font-size:.875rem}
.foot{margin-top:18px;color:var(--ink-3);font-size:.75rem}

.char-hero{display:flex;align-items:flex-end;gap:20px;margin-bottom:8px}
.char-hero .cell{--cell:116px}
.ci-tr{font-family:var(--hanja);font-size:3.25rem;line-height:1.1}
.ci-hun{font-size:1.125rem;font-weight:700;margin-top:6px}
.ci-meta{color:var(--ink-2);font-size:.875rem;margin-top:4px}

/* 보여주기: 상대에게 내미는 화면이라 색·칸 없이 글자만 */
.show{position:fixed;inset:0;z-index:50;background:#ffffff;color:#000000;display:flex;flex-direction:column}
.show.inv{background:#000000;color:#ffffff}
.show-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px 8px;overflow:hidden;text-align:center}
.show-lead{font-family:var(--zh-sans);font-weight:500;opacity:.75}
.show-main{width:100%;font-family:var(--zh-sans);font-weight:700;line-height:1.16;word-break:break-all}
.show-addr{font-family:var(--zh-sans);font-weight:500;margin-top:.4em;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.show-help{padding:0 16px 8px;text-align:center;font-size:.9375rem;opacity:.7;line-height:1.45}
.show-bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(128,128,128,.35)}
.show-bar button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid currentColor;font-weight:700;color:inherit}

/* 카드 탭 */
.tcard{margin:0 16px 14px;padding:16px 16px 14px;border:1.5px solid var(--ink);border-radius:6px}
.tc-title{font-size:.8125rem;font-weight:700;color:var(--ink-2)}
.tc-lead{margin-top:10px;font-family:var(--zh-sans);color:var(--ink-2)}
.tc-name{margin:2px 0 6px;font-family:var(--zh-sans);font-size:calc(var(--fz)*1.55);line-height:1.25;font-weight:700;word-break:break-all}
.tc-addr{font-family:var(--zh-sans);font-size:1.0625rem;line-height:1.4;word-break:break-all}
.tc-ko{margin-top:8px;color:var(--ink-2);font-size:.875rem}
.tc-note{margin-top:2px;color:var(--ink-3);font-size:.8125rem}
.tc-act{display:flex;gap:8px;margin-top:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.quick button{border:1px solid var(--rule);border-radius:12px;padding:12px;text-align:left;min-height:76px}
.qz{display:block;font-family:var(--zh-sans);font-size:1.125rem;line-height:1.3;word-break:break-all}
.qk{display:block;margin-top:3px;font-size:.8125rem;color:var(--ink-2);line-height:1.35}
.myform{display:grid;gap:8px;padding:0 16px}
.myform textarea,.myform input,.wall-search{width:100%;border:1.5px solid var(--rule);border-radius:12px;background:var(--page);padding:10px 12px;outline:none}
.myform textarea{min-height:84px;resize:vertical;font-family:var(--zh-sans);font-size:1.125rem}
.myform textarea:focus,.myform input:focus,.wall-search:focus{border-color:var(--ink)}
.mycards{list-style:none;margin:10px 0 0;padding:0 16px}
.mycards li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.mycards .mz{flex:1;min-width:0}
.mycards .mz b{display:block;font-family:var(--zh-sans);font-weight:500;word-break:break-all}
.mycards .mz span{display:block;font-size:.8125rem;color:var(--ink-2)}
.mini-btn{min-height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;font-size:.875rem}

/* 학습 */
.ltabs{margin-top:14px}
.tone-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 16px 4px;font-size:.8125rem;color:var(--ink-2)}
.tone-key b{font-size:1rem}
.fc-ctrl{display:grid;gap:8px;padding:12px 0 6px}
.fc-ctrl .seg{margin-bottom:0}
.fc-stat{display:flex;justify-content:space-between;margin:10px 16px 6px;font-size:.8125rem;color:var(--ink-2)}
.bar{height:4px;margin:0 16px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.fc-card{margin:16px;min-height:300px;padding:22px 16px;border:1.5px solid var(--grid-strong);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.fc-card .tzg{justify-content:center;margin:0}
.fc-ko{font-size:calc(var(--fz)*1.45);font-weight:700;line-height:1.35}
.fc-back{margin-top:16px;display:grid;gap:4px;width:100%}
.fc-back .fc-py{font-size:1.0625rem;font-weight:700}
.fc-back .fc-kp{color:var(--ink-2)}
.fc-back .fc-hj{font-family:var(--hanja);color:var(--ink-2)}
.fc-hint{color:var(--ink-3);font-size:.8125rem;margin-top:14px}
.fc-btns{display:flex;gap:8px;padding:0 16px}
.wall-tools{display:flex;gap:8px;align-items:center;padding:12px 16px 10px}
.wall-tools .wall-search{flex:1;height:44px}
.wall-tools label{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--ink-2);white-space:nowrap}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px 8px;padding:6px 16px 16px}
.wall button{display:flex;flex-direction:column;align-items:center;gap:3px}
.wb{width:56px;height:56px}
.wz{font-family:var(--zh-serif);font-size:36px;line-height:1}
.wt{font-family:var(--hanja);font-size:.8125rem;color:var(--ink-2);white-space:nowrap}
.rules{list-style:none;margin:0;padding:0 16px}
.rules li{padding:14px 0;border-bottom:1px solid var(--rule)}
.rk{font-size:.8125rem;font-weight:700;color:var(--ink-3)}
.rv{margin-top:2px;font-family:var(--zh-sans);font-size:1.125rem;font-weight:700}
.rp{margin-top:4px;color:var(--ink-2);font-size:.875rem;line-height:1.55}
.rx{margin-top:6px;font-family:var(--zh-sans);font-size:.9375rem;line-height:1.6}
.note{margin:14px 16px 20px;color:var(--ink-3);font-size:.8125rem;line-height:1.55}

/* 설정 */
.set{display:grid;gap:18px}
.set .lbl{font-size:.8125rem;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.set .seg{margin:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.tog input{width:22px;height:22px;accent-color:var(--ink)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--ink)}
.srcs{margin:0;padding-left:18px;color:var(--ink-2);font-size:.8125rem;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:60;display:flex;align-items:center;gap:10px;max-width:min(92vw,520px);padding:11px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:.875rem;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;font-weight:700;text-decoration:underline;color:inherit}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}.toast,.filters{transition:none}}
@media (min-width:560px){.quick{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-row">
      <div class="brand"><span class="logo tz" lang="zh-Hans" aria-hidden="true"><span>说</span></span><span><b>출장 중국어</b><small>CMEE 2026 푸저우</small></span></div>
      <button class="icon-btn" id="btnSettings" type="button">설정</button>
    </div>
    <div class="search" id="searchWrap">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="뜻, 한자, 병음으로 찾기" aria-label="표현 찾기">
      <button id="qClear" class="q-clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
    </div>
  </header>
  <main>
    <section id="v-find" class="view" aria-label="찾기">
      <div class="filters" id="filters">
        <div class="chips" id="catChips"></div>
        <div class="chips" id="subChips"></div>
        <div class="seg" id="prioSeg"></div>
      </div>
      <p class="count" id="count"></p>
      <ol class="list" id="list"></ol>
    </section>
    <section id="v-cards" class="view" aria-label="카드" hidden>
      <h2 class="vh">택시에서 보여주기</h2>
      <div id="taxi"></div>
      <h2 class="vh">현장에서 바로 보여줄 문장</h2>
      <div class="quick" id="quick"></div>
      <h2 class="vh">내가 만든 카드</h2>
      <p class="vp">식당 주소나 받은 메모처럼 DB에 없는 중국어를 붙여 넣어 두면, 폰에만 저장돼 오프라인에서도 보여줄 수 있어요.</p>
      <form class="myform" id="myForm" autocomplete="off">
        <textarea id="myZh" lang="zh-Hans" placeholder="중국어 붙여넣기 (예: 식당 이름과 주소)" required></textarea>
        <input id="myKo" placeholder="내 메모 (선택)">
        <button class="btn primary" type="submit">카드 저장</button>
      </form>
      <ul class="mycards" id="myCards"></ul>
    </section>
    <section id="v-fav" class="view" aria-label="즐겨찾기" hidden>
      <h2 class="vh">즐겨찾기</h2>
      <ol class="list" id="favList"></ol>
    </section>
    <section id="v-learn" class="view" aria-label="학습" hidden>

<script>
(function(){

var D = window.DATA;
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var store = {
  get: function(k, d){ try { var v = localStorage.getItem('cmee.' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem('cmee.' + k, JSON.stringify(v)); } catch(e){} }
};
var S = Object.assign({size:'m', theme:'auto', pinyin:true, tones:true, rate:0.8}, store.get('settings', {}));
var fav = new Set(store.get('fav', []));
var known = new Set(store.get('known', []));
var mycards = store.get('mycards', []);
var byId = new Map(D.e.map(function(e){ return [e.id, e]; }));
var SUB = new Map(D.subs.map(function(s){ return [s[0], {name:s[1], cat:s[2]}]; }));
var CH = new Map(D.chars.map(function(c){ return [c[0] + c[1], c]; }));
var HAN = /[㐀-鿿]/;
var isApp = !!window.AndroidApp;

/* ── 검색용 정규화: 성조 부호·공백·문장부호 제거, ü→v. 한글은 자모로 풀어 덜 친 글자도 맞춤 */
function norm(s){
  return String(s || '').toLowerCase().normalize('NFD')
    .replace(/[̀́̄̌]/g, '').replace(/ü/g, 'v').replace(/[̀-ͯ]/g, '')
    .replace(/[\s'’\-,.?!，。？！、\/·:：()（）~★]/g, '');
}
D.e.forEach(function(e){
  var sub = SUB.get(e.s).name;
  e._ix = [e.id, e.zh, e.tr, e.ko, e.kp, e.kr, e.py, e.sit, e.tip, sub].map(norm).join('|') + '|' + norm(e.py).replace(/v/g, 'u');
});

function toneOf(p){ var n = String(p).normalize('NFD');
  if (/̄/.test(n)) return 1; if (/́/.test(n)) return 2; if (/̌/.test(n)) return 3; if (/̀/.test(n)) return 4; return 5; }
function zhHTML(e){ var k = 0, out = '';
  Array.from(e.zh).forEach(function(c){ if (HAN.test(c)) { var t = e.ch[k++][3]; out += '<span class="t' + t + '">' + c + '</span>'; } else out += esc(c); });
  return out; }
function pyHTML(e){ return e.ps.map(function(p){ return p[1] ? '<span class="t' + p[1] + '">' + esc(p[0]) + '</span>' : esc(p[0]); }).join(''); }
function stars(p){ return '★★★'.slice(0, p); }

/* ── 설정 */
function systemDark(){
  try { if (window.AndroidApp && AndroidApp.isNightMode) return !!AndroidApp.isNightMode(); } catch(e){}
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applySettings(){
  var r = document.documentElement;
  r.setAttribute('data-size', S.size);
  r.classList.toggle('tones', !!S.tones);
  r.classList.toggle('nopy', !S.pinyin);
  var dark = S.theme === 'dark' || (S.theme === 'auto' && systemDark());
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { if (window.AndroidApp && AndroidApp.setDarkBars) AndroidApp.setDarkBars(dark); } catch(e){}
}
function saveSettings(){ store.set('settings', S); applySettings(); }
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); } catch(e){} }
window.__setSystemDark = function(){ applySettings(); };

/* ── 토스트 */
var toastTimer;
function toast(msg, action, ms){
  $('#toastMsg').textContent = msg;
  var b = $('#toastAct');
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = function(){ hideToast(); action.fn(); }; } else b.hidden = true;
  $('#toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms || 2600);
}
function hideToast(){ $('#toast').classList.remove('on'); }

/* ── 음성: 앱(APK)에서는 안드로이드 TTS, 브라우저에서는 Web Speech */
var voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e){} }
function zhVoice(){
  return voices.filter(function(v){ return /^zh[-_]?(CN|Hans)/i.test(v.lang); })[0]
      || voices.filter(function(v){ return /^(zh|cmn)/i.test(v.lang); })[0] || null;
}
function speak(text){
  text = String(text || '').replace(/\s*\/\s*/g, '，');
  if (window.AndroidTTS) {
    var r = 'error';
    try { r = AndroidTTS.speak(text, S.rate); } catch(e){}
    if (r !== 'ok') ttsHelp(r);
    return;
  }
  if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 읽기를 지원하지 않아요.'); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = S.rate;
    var v = zhVoice(); if (v) u.voice = v;
    else if (voices.length) toast('중국어 음성이 안 보여요. 폰 설정의 텍스트 음성 변환에서 중국어 음성을 설치하세요.', null, 5000);
    speechSynthesis.speak(u);
  } catch(e){ toast('음성을 재생하지 못했어요.'); }
}
function ttsHelp(code){
  var msg = code === 'init' ? '음성 엔진을 준비하고 있어요. 잠시 뒤 다시 눌러 주세요.'
          : '중국어 음성이 없어요. 텍스트 음성 변환 설정에서 중국어(간체) 음성을 설치해 주세요.';
  toast(msg, (window.AndroidApp && code !== 'init') ? {label:'설정 열기', fn:function(){ try { AndroidApp.openTtsSettings(); } catch(e){} }} : null, 6000);

var showData = null, wakeLock = null;
function openShow(d){
  showData = d;
  $('#showLead').textContent = d.lead || ''; $('#showLead').hidden = !d.lead;
  $('#showMain').textContent = d.main;
  $('#showAddr').textContent = d.addr || ''; $('#showAddr').hidden = !d.addr;
  $('#showHelp').textContent = [d.py, d.ko].filter(Boolean).join('   ');
  $('#show').hidden = false; ovPush('show'); fitShow(); keepAwake(true);
}
function hideShow(){ $('#show').hidden = true; keepAwake(false); resetOrientation(); showData = null; }
function fitShow(){
  var stage = $('#showStage'), main = $('#showMain'), lead = $('#showLead'), addr = $('#showAddr');
  var lo = 14, hi = Math.max(40, Math.min(window.innerWidth, window.innerHeight) * 0.8);
  for (var i = 0; i < 16; i++) {
    var mid = (lo + hi) / 2;
    main.style.fontSize = mid + 'px';
    lead.style.fontSize = Math.max(16, mid * 0.38) + 'px';
    addr.style.fontSize = Math.max(16, mid * 0.42) + 'px';
    if (stage.scrollHeight <= stage.clientHeight && main.scrollWidth <= main.clientWidth + 1) lo = mid; else hi = mid;
  }
  main.style.fontSize = Math.floor(lo) + 'px';
  lead.style.fontSize = Math.max(16, lo * 0.38) + 'px';
  addr.style.fontSize = Math.max(16, lo * 0.42) + 'px';
}
window.addEventListener('resize', function(){ if (!$('#show').hidden) fitShow(); });
function keepAwake(on){
  try { if (window.AndroidApp && AndroidApp.keepScreenOn) { AndroidApp.keepScreenOn(!!on); return; } } catch(e){}
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }).catch(function(){});
    else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function rotate(){
  if (window.AndroidApp && AndroidApp.toggleOrientation) { try { AndroidApp.toggleOrientation(); } catch(e){} return; }
  var el = document.documentElement;
  var p = (!document.fullscreenElement && el.requestFullscreen) ? el.requestFullscreen() : Promise.resolve();
  p.then(function(){
    var cur = (screen.orientation && screen.orientation.type) || 'portrait';
    return screen.orientation.lock(cur.indexOf('portrait') === 0 ? 'landscape' : 'portrait');
  }).catch(function(){ toast('폰을 가로로 돌려 주세요.'); });
}
function resetOrientation(){
  try { if (window.AndroidApp && AndroidApp.resetOrientation) { AndroidApp.resetOrientation(); return; } } catch(e){}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch(e){}
}

  } else {
    el.innerHTML = '<p class="note">한국 한자음은 옛 중국어(중고한어)의 받침을 간직하고 있어서, 받침만 보고도 보통화 발음을 꽤 짐작할 수 있어요. 성조는 예외가 많으니 따로 익히세요.</p>' +
      '<ol class="rules">' + D.sound.map(function(r){ return '<li><p class="rk">' + esc(r[0]) + '</p><p class="rv">' + esc(r[1]) + '</p><p class="rp">' + esc(r[2]) + '</p><p class="rx" lang="zh-Hans">' + esc(r[3]) + '</p></li>'; }).join('') + '</ol>';
  }
}

/* ── 설정 시트 */
function settingsHTML(){
  var c = D.meta.counts;
  return '<div class="set">' +
    '<div><p class="lbl">글자 크기</p>' + segHTML('set-size', [['s','작게'],['m','보통'],['l','크게']], S.size) + '</div>' +
    '<div><p class="lbl">화면</p>' + segHTML('set-theme', [['auto','폰 설정 따름'],['light','밝게'],['dark','어둡게']], S.theme) + '</div>' +
    '<label class="tog">병음 보이기<input type="checkbox" data-set="pinyin"' + (S.pinyin ? ' checked' : '') + '></label>' +
    '<label class="tog">성조 색 보이기<input type="checkbox" data-set="tones"' + (S.tones ? ' checked' : '') + '></label>' +
    toneKey().replace('class="tone-key"', 'class="tone-key" style="margin:0"') +
    '<div><p class="lbl">듣기 속도 <span id="rateVal">' + S.rate.toFixed(1) + '</span>배</p><div class="range"><span>느리게</span><input type="range" min="0.5" max="1.2" step="0.1" value="' + S.rate + '" data-set="rate" aria-label="듣기 속도"><span>빠르게</span></div></div>' +
    '<div class="actions" style="margin:0"><button class="btn" type="button" data-act="tts-test">중국어 음성 확인</button>' +
    (isApp ? '<button class="btn quiet" type="button" data-act="tts-settings">음성 설정 열기</button>' : '') + '</div>' +
    '<div class="sec"><h3>기록 지우기</h3><div class="actions" style="margin:0"><button class="btn quiet" type="button" data-act="reset-known">외운 표시</button><button class="btn quiet" type="button" data-act="reset-fav">즐겨찾기</button></div></div>' +
    '<div class="sec"><h3>이 앱의 데이터</h3><p style="font-size:.875rem;color:var(--ink-2)">표현 ' + c.total + '개(일상 ' + c['일상'] + ', 박람회 ' + c['박람회'] + '), 필수 ★★★ ' + c.prio3 + '개, 글자 ' + c.chars + '자. 버전 ' + esc(D.meta.version) + ', ' + esc(D.meta.built) + ' 작성. 인터넷 없이 동작해요.</p>' +
    '<ul class="srcs">' + D.meta.sources.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>' +
  '</div>';
}

/* ── 화면 전환 */
var view = 'find';
function setView(v){
  view = v;
  $$('.view').forEach(function(s){ s.hidden = s.id !== 'v-' + v; });
  $$('#tabbar button').forEach(function(b){ b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'); });
  $('#searchWrap').hidden = v !== 'find';
  if (v === 'fav') renderFav();
  if (v === 'learn') renderLearn();
  window.scrollTo(0, 0);
}

/* ── 이벤트 */
document.addEventListener('click', function(ev){
  var t = ev.target, b;
  if ((b = t.closest('.fc-card[data-act]'))) { FC.flip = !FC.flip; renderFlashShell(); return; }
  if ((b = t.closest('[data-fav]'))) { toggleFav(b.dataset.fav); return; }
  if ((b = t.closest('[data-char]'))) { openSheet({type:'char', key:b.dataset.char}); return; }
  if ((b = t.closest('.row'))) { openSheet({type:'entry', id:b.dataset.id}); return; }
  if ((b = t.closest('#tabbar button'))) { setView(b.dataset.v); return; }
  if ((b = t.closest('[data-cat]'))) { F.cat = b.dataset.cat; F.sub = 'all'; buildChips(); renderList(); return; }
  if ((b = t.closest('[data-sub]'))) { F.sub = b.dataset.sub; buildChips(); renderList(); return; }
  if ((b = t.closest('[data-prio]'))) { F.prio = b.dataset.prio; buildChips(); renderList(); return; }
  if ((b = t.closest('[data-lt]'))) { LT = b.dataset.lt; renderLearn(); return; }
  if ((b = t.closest('[data-fc-tier]'))) { FC.tier = b.dataset.fcTier; fcBuild(); renderFlashShell(); return; }
  if ((b = t.closest('[data-fc-scope]'))) { FC.scope = b.dataset.fcScope; fcBuild(); renderFlashShell(); return; }
  if ((b = t.closest('[data-fc-dir]'))) { FC.dir = b.dataset.fcDir; FC.flip = false; renderFlashShell(); return; }
  if ((b = t.closest('[data-set-size]'))) { S.size = b.dataset.setSize; saveSettings(); renderSheet(); return; }
  if ((b = t.closest('[data-set-theme]'))) { S.theme = b.dataset.setTheme; saveSettings(); renderSheet(); return; }
  if ((b = t.closest('[data-taxi]'))) { var tx = taxiBy(b.dataset.taxi); openShow({lead: tx.lead, main: tx.name, addr: tx.addr, ko: tx.ko, tts: tx.tts}); return; }
  if ((b = t.closest('[data-taxi-say]'))) { speak(taxiBy(b.dataset.taxiSay).tts); return; }
  if ((b = t.closest('[data-quick]'))) { showEntry(byId.get(b.dataset.quick)); return; }
  if ((b = t.closest('[data-my-show]'))) { var m = mycards[+b.dataset.myShow]; openShow({main: m.zh, ko: m.ko, tts: m.zh}); return; }
  if ((b = t.closest('[data-my-del]'))) { mycards.splice(+b.dataset.myDel, 1); store.set('mycards', mycards); renderMyCards(); toast('카드를 지웠어요.'); return; }
  if ((b = t.closest('[data-a]'))) {
    var a = b.dataset.a;
    if (a === 'close') goBack();
    else if (a === 'speak' && showData) speak(showData.tts || showData.main);
    else if (a === 'invert') $('#show').classList.toggle('inv');
    else if (a === 'rotate') rotate();
    return;
  }
  if ((b = t.closest('[data-act]'))) {
    var act = b.dataset.act;
    if (act === 'speak') speak(byId.get(b.dataset.id).tts);
    else if (act === 'show') showEntry(byId.get(b.dataset.id));
    else if (act === 'fc-flip') { FC.flip = !FC.flip; renderFlashShell(); }
    else if (act === 'fc-know') { known.add(FC.cur.id); store.set('known', Array.from(known)); FC.cur = FC.queue.shift() || null; FC.flip = false; renderFlashShell(); }
    else if (act === 'fc-again') { FC.queue.splice(Math.min(3, FC.queue.length), 0, FC.cur); FC.cur = FC.queue.shift(); FC.flip = false; renderFlashShell(); }
    else if (act === 'fc-speak') { if (FC.cur) speak(FC.cur.tts); }
    else if (act === 'fc-reset') { FC.pool.forEach(function(e){ known.delete(e.id); }); store.set('known', Array.from(known)); fcBuild(); renderFlashShell(); }
    else if (act === 'tts-test') speak('你好，我是韩国人。');
    else if (act === 'tts-settings') { try { AndroidApp.openTtsSettings(); } catch(e){} }
    else if (act === 'reset-known') { known.clear(); store.set('known', []); FC.pool = []; toast('외운 표시를 모두 지웠어요.'); }
    else if (act === 'reset-fav') { fav.clear(); store.set('fav', []); renderList(); toast('즐겨찾기를 모두 지웠어요.'); }
    return;
  }
});
document.addEventListener('keydown', function(ev){
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row-main,[data-act="fc-flip"]')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Escape' && ov.length) goBack();
});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.dataset.set === 'pinyin') { S.pinyin = t.checked; saveSettings(); }
  if (t.dataset.set === 'tones') { S.tones = t.checked; saveSettings(); }
  if (t.id === 'wallSimp') { WALL.simp = t.checked; renderWallShell(); }
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.id === 'q') { F.q = t.value; $('#qClear').hidden = !t.value; renderList(); }
  if (t.id === 'wallSearch') { WALL.q = t.value; renderWallShell(); }
  if (t.dataset.set === 'rate') { S.rate = +t.value; $('#rateVal').textContent = S.rate.toFixed(1); saveSettings(); }
});
$('#qClear').addEventListener('click', function(){ var q = $('#q'); q.value = ''; F.q = ''; this.hidden = true; renderList(); q.focus(); });
$('#btnSettings').addEventListener('click', function(){ openSheet({type:'settings'}); });
$('#sheetBack').addEventListener('click', goBack);
$('#sheet').addEventListener('click', function(ev){ if (ev.target === this) goBack(); });
$('#myForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var zh = $('#myZh').value.trim(); if (!zh) return;
  mycards.unshift({zh: zh, ko: $('#myKo').value.trim()}); store.set('mycards', mycards);
  this.reset(); renderMyCards(); toast('카드를 저장했어요.');
});
function taxiBy(k){ return D.taxi.filter(function(t){ return t.key === k; })[0]; }

applySettings(); buildChips(); renderList(); renderCards();
})();
</script>
</body>
</html>
